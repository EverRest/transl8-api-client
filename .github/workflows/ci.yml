name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  NODE_VERSION: '22'

jobs:
  ci:
    name: Typecheck, test, generate, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only what we ship. Dev-only advisories are Dependabot's.
      - name: Audit runtime dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      # openapi.json must be the file sync-openapi wrote. A hand edit fails here.
      - name: Check the spec record
        run: npm run check-spec

      # No network: orval reads only the tracked openapi.json. A diff means
      # src/generated was edited by hand or not regenerated after a sync.
      - name: Regenerate the client and check for drift
        run: |
          npm run generate
          git diff --exit-code src/generated

      - name: Build
        run: npm run build

      - name: CLI smoke test
        run: npm run cli-e2e
