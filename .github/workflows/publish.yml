name: Publish @transl8.ai/api-client

# Public npmjs, scope @transl8.ai, OIDC trusted publishing. The Trusted
# Publisher on npmjs must list owner EverRest, repository transl8-api-client,
# workflow publish.yml, no environment. This workflow publishes on a version
# bump in package.json (or by hand: Actions -> Run workflow). No NPM_TOKEN.

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
  workflow_dispatch:

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build, verify, and publish
    # A manual run on another branch must not publish unmerged code.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Need the previous commit too, to detect whether package.json's
          # version actually changed on this push (vs. another field in
          # package.json triggering the path filter above).
          fetch-depth: 2

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'
          scope: '@transl8.ai'

      - name: Check whether the version actually bumped
        id: version-check
        run: |
          NAME=$(node -p "require('./package.json').name")
          CURRENT=$(node -p "require('./package.json').version")
          PREVIOUS=$(git show HEAD^:package.json 2>/dev/null | node -p "JSON.parse(require('fs').readFileSync(0,'utf8')).version" 2>/dev/null || echo "none")
          if [ "$CURRENT" = "$PREVIOUS" ] && [ "${{ github.event_name }}" != "workflow_dispatch" ]; then
            echo "Version unchanged ($CURRENT) - skipping."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            if OUT=$(npm view "$NAME@$CURRENT" version 2>&1); then
              echo "$NAME@$CURRENT is already on npm - skipping."
              echo "changed=false" >> "$GITHUB_OUTPUT"
            elif echo "$OUT" | grep -q "E404"; then
              echo "$NAME@$CURRENT not on npm - will publish."
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "::error::npm view failed for a reason other than E404, not publishing: $OUT"
              exit 1
            fi
          fi

      - name: Install dependencies
        if: steps.version-check.outputs.changed == 'true'
        # --ignore-scripts: this job holds id-token: write, so a dependency
        # install script must not run in it. Follow-up: split into a verify
        # job (no id-token) and a publish job (id-token only).
        run: npm ci --ignore-scripts

      - name: Typecheck, test, build and CLI smoke test
        if: steps.version-check.outputs.changed == 'true'
        run: |
          npm run typecheck
          npm test
          npm run build
          npm run cli-e2e

      # Node 22 bundles npm 10.9.x, which cannot do OIDC trusted publishing
      # (ENEEDAUTH); it needs npm >= 11.5.1.
      - name: Upgrade npm for trusted publishing
        if: steps.version-check.outputs.changed == 'true'
        run: |
          npm install -g npm@11.21.1
          NPM_VERSION=$(npm -v)
          echo "npm $NPM_VERSION"
          [ "$(printf '%s\n11.5.1\n' "$NPM_VERSION" | sort -V | head -n1)" = "11.5.1" ] \
            || { echo "npm $NPM_VERSION < 11.5.1 - trusted publishing would fail"; exit 1; }

      - name: Publish
        if: steps.version-check.outputs.changed == 'true'
        # OIDC - npm CLI >= 11.5.1 detects the Actions token. No NODE_AUTH_TOKEN.
        run: npm publish --access public
