# Weekly updates. Minor and patch updates come in one grouped PR so the queue
# stays small; majors come one by one, because they need a read.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # vitest 5 needs a newer esbuild than the build accepts; update both by hand.
      - dependency-name: vitest
        update-types: ['version-update:semver-major']
      # The build script is tested against one esbuild line; a major needs a read.
      - dependency-name: esbuild
        update-types: ['version-update:semver-major']
      # A new TypeScript major changes the generated client output; update by hand.
      - dependency-name: typescript
        update-types: ['version-update:semver-major']
      # @types/node must track the supported Node major (22).
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']
